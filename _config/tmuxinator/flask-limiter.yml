name: flask-limiter
root: ~/_dev/_git/flask-limiter

on_project_first_start:
 - asdf local python 3.9.7
 - uv sync --all-extras --group dev

on_project_start:
 - git fetch

on_project_exit:
 - docker-compose down

windows:
  - editor:
      layout: main-horizontal
      panes:
        - vim .
        - lazygit
  - qa:
      layout: even-vertical
      panes:
        - find -g '*.py' | entr -c uv run pytest
        - find -g '*.py' | entr -c make lint-fix
        - uv run sphinx-autobuild --port 18003 doc/source doc/build/html
