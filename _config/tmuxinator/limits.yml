name: limits
root: ~/_dev/_git/limits

on_project_first_start:
 - asdf local python 3.11.0
 - uv sync --all-extras --group dev --group docs

on_project_start:
 - git fetch

on_project_exit:
 - docker-compose down

windows:
  - editor:
      layout: main-horizontal
      panes:
        - vim .
        - pwd
  - qa:
      layout: even-vertical
      panes:
        - find -g '*.py' | entr make lint-fix
        - uv run sphinx-autobuild --port 18004 doc/source doc/build/html
